name: doc checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly external-standards fetch. It does not deploy and does not write to this repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown and tool URL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run documentation unit tests
        run: python3 -m unittest tests.test_doc_checks

      - name: Run read-only documentation checks
        run: python3 scripts/check-docs.py --json-out "$RUNNER_TEMP/doc-check.json"

      - name: Upload the check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-check-report
          path: ${{ runner.temp }}/doc-check.json
          if-no-files-found: warn

  external-standards:
    name: Weekly external standards URL check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Request cited standards URLs
        run: python3 scripts/check-docs.py --external-standards --json-out "$RUNNER_TEMP/standards-check.json"

      - name: Upload the standards report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standards-url-report
          path: ${{ runner.temp }}/standards-check.json
          if-no-files-found: warn
